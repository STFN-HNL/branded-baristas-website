name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm i18n:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: ci-project
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ci-token
          SANITY_WEBHOOK_SECRET: ci-secret
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-key
          RESEND_API_KEY: ci-key
          RESEND_FROM_EMAIL: hello@branded-baristas.com
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps chromium
      - env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: ci-project
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_READ_TOKEN: ci-token
          SANITY_WEBHOOK_SECRET: ci-secret
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-key
          RESEND_API_KEY: ci-key
          RESEND_FROM_EMAIL: hello@branded-baristas.com
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
